<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Informatika Team!</title>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Footer -->
    <footer class="site-footer"> <!-- Class is used to edit how it looks in CSS -->
        <p>© Snow-Team 2020</p>
    </footer> <!-- Footer location doesnt metter since it will be edited / relocate in CSS -->

    <!-- Intro Section -->
    <section id="intro" class="intro-section"> <!-- Id is a global value that will be req across the code -->
        <div class="container"> <!-- Center Intro -->
            <div class="glow"></div> <!-- Div is a division used to group certain lines of code together -->
            <div class="profile-pic">
                <img src="img/kemurnian.png" alt="Profile"> <!-- Alt is a back up if the pic doesnt shows up (it will display "profile") -->
            </div>
            <h1 class="intro-text">Group 3</h1>
            <button class="enter-btn" id="enterBtn">ENTER</button>
        </div>
    </section>

    <!-- Team Section -->
    <section id="white-section" class="white-section">
        <div class="section-title">
            <h2>Meet the team!</h2> <!-- h2 is a heading smaller than h1 -->
        </div>
        <div class="boxes-container">
            <!-- Boxes -->
            <div class="box" data-team="j"><img src="img/j.png" alt="J"></div> <!-- Its a box? what you want? -->
            <div class="box" data-team="k"><img src="img/k.png" alt="K"></div>
            <div class="box" data-team="v"><img src="img/v.png" alt="V"></div>
            <div class="box" data-team="e"><img src="img/e.png" alt="E"></div>

            <!-- Leave button -->
            <button class="leave-btn">LEAVE</button>
        </div>
    </section>

    <!-- Team Detail Section -->
    <section id="j-detail" class="team-detail-section j-bg"> <!-- Section is like a div but only used to bound similiar/related content -->
        <div class="detail-container">
            <img src="5219561e-1b6e-4fb6-ae79-1dd7164e7ab3.jpeg" alt="J">
            <h2>jennifer Jolie</h2>
            <p>Ide Kode / Menjelaskan Kode</p>
            <button class="back-to-boxes-btn">BACK</button>
        </div>
    </section>
    <section id="k-detail" class="team-detail-section k-bg">
        <div class="detail-container">
            <img src="img/k2.png" alt="K">
            <h2>Kenzie Marvella</h2>
            <p>Ide Slide / Menjelaskan Kode</p>
            <button class="back-to-boxes-btn">BACK</button>
        </div>
    </section>
    <section id="v-detail" class="team-detail-section v-bg">
        <div class="detail-container">
            <img src="img/v.png" alt="V">
            <h2>Varrel Oktavianus Sugono</h2>
            <p>Ide Kode/ Menjelaskan Kode</p>
            <button class="back-to-boxes-btn">BACK</button>
        </div>
    </section>
    <section id="e-detail" class="team-detail-section e-bg">
        <div class="snow-container"></div>
        <div class="detail-container">
            <img src="img/e.png" alt="E">
            <h2>Edgard Le</h2>
            <p>Pembuat Kode / Menjelaskan Kode</p>
            <button class="back-to-boxes-btn">BACK</button>
        </div>
    </section>

    <script src="script.js"></script> <!-- Can be put on the top but its unideal since it can couse error -->
</body>
</html>
