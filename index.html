<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Informatika Team!</title>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Footer: Fixed footer used across intro, white-section and detail pages -->
    <footer class="site-footer">
        <p>© Snow-Team 2020</p>
    </footer>

    <!-- Intro Section: Landing view with profile, title and ENTER button -->
    <section id="intro" class="intro-section">
        <div class="container">
            <div class="glow"></div>
            <div class="profile-pic">
                <img src="img/kemurnian.png" alt="Profile">
            </div>
            <h1 class="intro-text">Group 3</h1>
            <!-- Enter button toggles .scrolled-down and reveals the team grid -->
            <button class="enter-btn" id="enterBtn">ENTER</button>
        </div>
    </section>

    <!-- Team Section: A grid presenting each team member. -->
    <section id="white-section" class="white-section">
        <div class="section-title">
            <h2>Meet the team!</h2>
        </div>
        <div class="boxes-container">
            <!-- Boxes: clickable cards; data-team maps to the detail section -->
            <div class="box" data-team="j"><img src="img/j.png" alt="J"></div>
            <div class="box" data-team="k"><img src="img/k.png" alt="K"></div>
            <div class="box" data-team="v"><img src="img/v.png" alt="V"></div>
            <div class="box" data-team="e"><img src="img/e.png" alt="E"></div>

            <!-- Leave button: returns instantly to the intro section -->
            <button class="leave-btn">LEAVE</button>
        </div>
    </section>

    <!-- Team Detail Sections: Overlays with profile details and BACK button -->
    <section id="j-detail" class="team-detail-section j-bg">
        <div class="detail-container">
            <img src="img/j2.png" alt="J">
            <h2>jennifer Jolie</h2>
            <p>Ide Kode / Menjelaskan Kode</p>
            <button class="back-to-boxes-btn">BACK</button>
        </div>
    </section>
    <section id="k-detail" class="team-detail-section k-bg">
        <div class="detail-container">
            <img src="img/k2.png" alt="K">
            <h2>Kenzie Marvella</h2>
            <p>Ide Slide / Menjelaskan Kode</p>
            <button class="back-to-boxes-btn">BACK</button>
        </div>
    </section>
    <section id="v-detail" class="team-detail-section v-bg">
        <div class="detail-container">
            <img src="https://images.unsplash.com/photo-1559253664-ca249d4608c6?ixlib=rb-1.2.1&auto=format&fit=crop&w=500&q=60" alt="V">
            <h2>Varrel Oktavianus Sugono</h2>
            <p>Ide Kode/ Menjelaskan Kode</p>
            <button class="back-to-boxes-btn">BACK</button>
        </div>
    </section>
    <section id="e-detail" class="team-detail-section e-bg">
        <div class="snow-container"></div>
        <div class="detail-container">
            <img src="img/e.png" alt="E">
            <h2>Edgard Le</h2>
            <p>Pembuat Kode / Menjelaskan Kode</p>
            <button class="back-to-boxes-btn">BACK</button>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
